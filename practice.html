<script>
var $=function(i){return document.getElementById(i)},q=new URLSearchParams(location.search);
$('t').innerHTML=ML.topics.map(function(k){return '<option value="'+k+'">'+ML.topicName[k]+'</option>'}).join('');

 function start(){var sp=$('m').value==='speed',g=+$('g').value,t=sp?'speed':$('t').value;
  ML.quiz($('box'),{grade:g,topic:t,kind:sp?'speed':'practice',medium:u?u.medium:'en',n:10,seconds:sp?60:0,opts:{},key:(sp?'speed':'practice')+'-g'+g+'-'+t});$('box').className='mlq-card'}
